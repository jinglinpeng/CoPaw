# Build QwenPaw Desktop:
# - Legacy desktop: Windows (conda-pack + NSIS), macOS (conda-pack -> .app)
# - Tauri desktop: Windows/macOS app bundles with PyInstaller backend sidecar
# Runs on release publish and manual dispatch.

name: QwenPaw Desktop Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_oss:
        description: 'Upload to OSS'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# The unsuffixed qwenpaw-tauri-latest.json manifest mirrors this variant so
# existing installs (whose baked-in endpoint points at the legacy manifest
# name) keep receiving updates. Switch to `lite` here to migrate the default
# download / auto-update channel; nothing in GitHub settings needs changing.
env:
  DEFAULT_DESKTOP_VARIANT: full
  # Desktop packaging variants, shared by the aggregation jobs below. The two
  # build matrices declare the same list inline (matrix values must be literal).
  VARIANTS: "full lite"

jobs:
  # On release events, fail fast if the DashScope secret is missing.
  # Without it, the verifier would silently skip the LLM chat round
  # and emit a misleading "PASS". Forks / manual dispatch are allowed
  # to run without the secret (UI-load checks still execute).
  check-release-secrets:
    name: Check release secrets (release only)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure DashScope secret is configured
        env:
          QWENPAW_DASHSCOPE_API_KEY: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}
        run: |
          if [ -z "$QWENPAW_DASHSCOPE_API_KEY" ]; then
            echo "::error::QWENPAW_DASHSCOPE_API_KEY is not set; release verification cannot validate the LLM chat round. Configure the repo secret before publishing."
            exit 1
          fi
          echo "DashScope secret present"

  build-windows:
    needs: [check-release-secrets]
    # Keep the legacy desktop packaging code in place, but do not build it.
    if: ${{ false }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          activate-environment: "qwenpaw-build"
          condarc-file: .github/condarc
          conda-remove-defaults: false

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Clean dist directory
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item -Recurse -Force dist
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Build Windows installer
        shell: pwsh
        run: conda run -n qwenpaw-build pwsh -File ./scripts/pack/build_win.ps1

      - name: List dist (on failure)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== dist contents ==="
          Get-ChildItem -Path dist -Recurse -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if (Test-Path dist\win-unpacked) {
            Write-Host "=== dist\win-unpacked (first 30) ==="
            Get-ChildItem -Path dist\win-unpacked -ErrorAction SilentlyContinue | Select-Object -First 30 | ForEach-Object { $_.Name }
          }

      - name: Set up runner Python for verification
        id: runner-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify desktop (Legacy Windows)
        timeout-minutes: 10
        uses: ./.github/actions/verify-legacy-windows
        with:
          dashscope-api-key: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}
          version: ${{ steps.version.outputs.version }}
          runner-python: ${{ steps.runner-python.outputs.python-path }}

      - name: Stop desktop server (Legacy Windows)
        if: always()
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP "qwenpaw-desktop.pid"
          if (Test-Path $pidFile) {
            $pidValue = (Get-Content $pidFile | Select-Object -First 1).Trim()
            if ($pidValue) {
              taskkill /F /PID $pidValue 2>$null | Out-Null
            }
          }

          # Best-effort port-based fallback (kill anything still on 8088).
          $line = netstat -ano 2>$null | Select-String -Pattern ':8088 .*LISTENING' |
            Select-Object -First 1
          if ($line) {
            $owner = ($line.ToString() -split '\s+')[-1].Trim()
            if ($owner) { taskkill /F /PID $owner 2>$null | Out-Null }
          }

          # Uninstall to leave the runner clean.
          $installDir = Join-Path $env:RUNNER_TEMP "QwenPaw-Verify"
          $uninstaller = Join-Path $installDir "Uninstall.exe"
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait `
              -ErrorAction SilentlyContinue
          }
          exit 0

      - name: Upload desktop verify logs (Legacy Windows)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-logs-legacy-windows-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/qwenpaw-desktop-stdout.log
            ${{ runner.temp }}/qwenpaw-desktop-stderr.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verify screenshots (Legacy Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-screenshots-legacy-windows-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/verify-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Desktop-Windows-${{ steps.version.outputs.version }}
          path: dist/QwenPaw-Setup-*.exe

  build-macos:
    needs: [check-release-secrets]
    # Keep the legacy desktop packaging code in place, but do not build it.
    if: ${{ false }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          activate-environment: "qwenpaw-build"
          condarc-file: .github/condarc
          conda-remove-defaults: false

      - name: Clean dist directory
        run: rm -rf dist && mkdir -p dist

      - name: Build macOS .app
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          chmod +x scripts/pack/build_macos.sh
          conda run -n qwenpaw-build bash -c 'CREATE_ZIP=1 ./scripts/pack/build_macos.sh'

      - name: Set up runner Python for verification
        id: runner-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify desktop (Legacy macOS)
        timeout-minutes: 10
        uses: ./.github/actions/verify-legacy-macos
        with:
          dashscope-api-key: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}
          version: ${{ steps.version.outputs.version }}
          runner-python: ${{ steps.runner-python.outputs.python-path }}

      - name: Stop desktop server (Legacy macOS)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/qwenpaw-desktop.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/qwenpaw-desktop.pid")" 2>/dev/null || true
          fi
          lsof -ti:8088 | xargs kill 2>/dev/null || true
          rm -rf dist/verify-legacy

      - name: Upload desktop verify logs (Legacy macOS)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-logs-legacy-macos-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/qwenpaw-desktop-stdout.log
            ${{ runner.temp }}/qwenpaw-desktop-stderr.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verify screenshots (Legacy macOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-screenshots-legacy-macos-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/verify-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Desktop-macOS-${{ steps.version.outputs.version }}
          path: dist/QwenPaw-*.zip

  build-tauri-windows:
    needs: [check-release-secrets]
    if: |
      always() &&
      (needs.check-release-secrets.result == 'success' ||
       needs.check-release-secrets.result == 'skipped')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, lite]
        include:
          - variant: full
            label: Full
          - variant: lite
            label: Lite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Clean dist directory
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item -Recurse -Force dist
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Build Tauri Windows package
        shell: pwsh
        env:
          # Authenticate the python-build-standalone release lookup in
          # stage_python_runtime.py to avoid anonymous API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          # sync_tauri_version.mjs derives the per-variant manifest name from
          # QWENPAW_DESKTOP_VARIANT, so a single endpoint var covers both.
          TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS }}
          QWENPAW_DESKTOP_VARIANT: ${{ matrix.variant }}
        run: ./scripts/pack-tauri/build_win_pyinstaller.ps1

      - name: Stage Tauri Windows installer and updater assets
        shell: pwsh
        run: |
          python scripts/pack-tauri/generate_update_manifest.py stage `
            --bundle-dir console/src-tauri/target/release/bundle/nsis `
            --pattern '*-setup.exe' `
            --target windows-x86_64 `
            --output "dist/QwenPaw-Tauri-${{ steps.version.outputs.version }}-Windows-${{ matrix.label }}-setup.exe" `
            --pubkey-config console/src-tauri/tauri.version.conf.json

      - name: Verify desktop (Tauri Windows)
        timeout-minutes: 10
        uses: ./.github/actions/verify-tauri-windows
        with:
          dashscope-api-key: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}

      - name: Stop desktop server (Tauri Windows)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # Kill the Tauri shell and its sidecar subprocess by name.
          Get-Process -Name "qwenpaw-desktop" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "qwenpaw-backend" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Get-Process -Name "qwenpaw-desktop" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "qwenpaw-backend" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0

      - name: Upload desktop verify logs (Tauri Windows)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-logs-tauri-windows-${{ matrix.variant }}-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/qwenpaw-desktop-stdout.log
            ${{ runner.temp }}/qwenpaw-desktop-stderr.log
            ~/AppData/Local/com.qwenpaw.desktop/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verify screenshots (Tauri Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-screenshots-tauri-windows-${{ matrix.variant }}-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/verify-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Tauri Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Desktop-Tauri-Windows-${{ steps.version.outputs.version }}-${{ matrix.variant }}
          path: dist/QwenPaw-Tauri-*-Windows-${{ matrix.label }}-setup.exe

      - name: Upload Tauri Windows updater metadata
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_oss == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: tauri-updater-meta-windows-${{ matrix.variant }}
          path: |
            dist/QwenPaw-Tauri-*-Windows-${{ matrix.label }}-setup.exe.sig
            dist/tauri-windows-x86_64-updater.json

  build-tauri-macos:
    needs: [check-release-secrets]
    if: |
      always() &&
      (needs.check-release-secrets.result == 'success' ||
       needs.check-release-secrets.result == 'skipped')
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        variant: [full, lite]
        include:
          - variant: full
            label: Full
          - variant: lite
            label: Lite
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          PIP_NO_CACHE_DIR: "1"
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: console/src-tauri

      - name: Clean dist directory
        run: rm -rf dist && mkdir -p dist

      - name: Build Tauri macOS package
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          # Authenticate the python-build-standalone release lookup in
          # stage_python_runtime.py to avoid anonymous API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          # sync_tauri_version.mjs derives the per-variant manifest name from
          # QWENPAW_DESKTOP_VARIANT, so a single endpoint var covers both.
          TAURI_UPDATER_ENDPOINTS: ${{ vars.TAURI_UPDATER_ENDPOINTS }}
          QWENPAW_DESKTOP_VARIANT: ${{ matrix.variant }}
        run: |
          chmod +x scripts/pack-tauri/build_macos_pyinstaller.sh
          bash scripts/pack-tauri/build_macos_pyinstaller.sh

      - name: Verify desktop (Tauri macOS)
        timeout-minutes: 10
        uses: ./.github/actions/verify-tauri-macos
        with:
          dashscope-api-key: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}

      - name: Stop desktop server (Tauri macOS)
        if: always()
        run: |
          # Kill the Tauri shell and its sidecar subprocess.
          pkill -f "QwenPaw Desktop" 2>/dev/null || true
          pkill -f "qwenpaw-backend" 2>/dev/null || true
          sleep 2
          pkill -9 -f "QwenPaw Desktop" 2>/dev/null || true
          pkill -9 -f "qwenpaw-backend" 2>/dev/null || true
          # Best-effort: kill anything sitting on the detected port.
          if [ -n "${BASE_URL:-}" ]; then
            PORT="${BASE_URL##*:}"
            lsof -ti:"$PORT" | xargs kill 2>/dev/null || true
          fi
          rm -rf dist/verify-tauri

      - name: Upload desktop verify logs (Tauri macOS)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-logs-tauri-macos-${{ matrix.variant }}-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/qwenpaw-desktop-stdout.log
            ${{ runner.temp }}/qwenpaw-desktop-stderr.log
            ~/Library/Logs/com.qwenpaw.desktop/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verify screenshots (Tauri macOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-screenshots-tauri-macos-${{ matrix.variant }}-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/verify-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Tauri macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenPaw-Desktop-Tauri-macOS-${{ steps.version.outputs.version }}-${{ matrix.variant }}
          path: dist/QwenPaw-Tauri-*-macOS-${{ matrix.label }}.zip

      - name: Upload Tauri macOS updater metadata
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_oss == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: tauri-updater-meta-macos-${{ matrix.variant }}
          path: |
            dist/QwenPaw-Tauri-*-macOS-${{ matrix.label }}.app.tar.gz
            dist/QwenPaw-Tauri-*-macOS-${{ matrix.label }}.app.tar.gz.sig
            dist/tauri-darwin-*-updater.json

  upload-release:
    needs: [build-tauri-windows, build-tauri-macos]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for scripts)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Move packages to root for upload
        run: |
          # Package file names already carry the -Full / -Lite variant, so the
          # four packages never collide when flattened to the workspace root.
          mv QwenPaw-Desktop-Tauri-Windows-*/QwenPaw-Tauri-*-Windows-*-setup.exe . 2>/dev/null || true
          mv QwenPaw-Desktop-Tauri-macOS-*/QwenPaw-Tauri-*-macOS-*.zip . 2>/dev/null || true
          # macOS updater archives live in the per-variant updater-meta artifacts.
          mv tauri-updater-meta-macos-*/QwenPaw-Tauri-*-macOS-*.app.tar.gz . 2>/dev/null || true

      - name: Generate per-variant Tauri updater manifests
        env:
          # Pass release.body via env so quotes/newlines/$ in markdown are safe.
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          NOTES="${RELEASE_BODY:-QwenPaw Desktop ${{ steps.version.outputs.version }}}"
          for variant in $VARIANTS; do
            label="${variant^}"
            stage="manifest-stage-${variant}"
            rm -rf "$stage"; mkdir -p "$stage"
            # Co-locate each platform sidecar JSON with its artifact and .sig so
            # the manifest generator can resolve them from one directory. The
            # Windows sidecar names the NSIS setup.exe; macOS names the
            # .app.tar.gz (already beside its sidecar in the meta artifact).
            cp tauri-updater-meta-windows-${variant}/* "$stage"/ 2>/dev/null || true
            cp QwenPaw-Tauri-*-Windows-${label}-setup.exe "$stage"/ 2>/dev/null || true
            cp tauri-updater-meta-macos-${variant}/* "$stage"/ 2>/dev/null || true
            cp QwenPaw-Tauri-*-macOS-${label}.app.tar.gz "$stage"/ 2>/dev/null || true
            metadata_args=()
            for f in "$stage"/tauri-windows-*-updater.json "$stage"/tauri-darwin-*-updater.json; do
              [ -f "$f" ] && metadata_args+=(--metadata "$f")
            done
            if [ ${#metadata_args[@]} -eq 0 ]; then
              echo "No ${variant} updater sidecars found, skipping"
              continue
            fi
            python scripts/pack-tauri/generate_update_manifest.py manifest \
              --version "${{ steps.version.outputs.version }}" \
              --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}" \
              "${metadata_args[@]}" \
              --notes "$NOTES" \
              --output "qwenpaw-tauri-latest-${variant}.json"
          done
          # Mirror the default variant under the legacy unsuffixed name so
          # existing installs pointing at qwenpaw-tauri-latest.json migrate to it.
          if [ -f "qwenpaw-tauri-latest-${DEFAULT_DESKTOP_VARIANT}.json" ]; then
            cp "qwenpaw-tauri-latest-${DEFAULT_DESKTOP_VARIANT}.json" qwenpaw-tauri-latest.json
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            QwenPaw-Tauri-*-Windows-*-setup.exe
            QwenPaw-Tauri-*-macOS-*.zip
            QwenPaw-Tauri-*-macOS-*.app.tar.gz
            qwenpaw-tauri-latest-*.json
            qwenpaw-tauri-latest.json
          fail-on-unmatched-files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-oss:
    needs: [build-tauri-windows, build-tauri-macos]
    # Run on: 1) release trigger, or 2) manual trigger with upload_to_oss checked
    if: |
      always() &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_to_oss == 'true')) &&
      needs.build-tauri-windows.result == 'success' &&
      needs.build-tauri-macos.result == 'success'
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: ${{ vars.OSS_BUCKET || 'qwenpaw-download' }}
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL || 'https://download.qwenpaw.agentscope.io/files/apps/desktop' }}
    steps:
      - name: Checkout (for scripts)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging helper dependencies
        run: python -m pip install packaging

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Install ossutil
        run: |
          wget https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip ossutil-v1.7.18-linux-amd64.zip
          chmod +x ossutil-v1.7.18-linux-amd64/ossutil64
          sudo mv ossutil-v1.7.18-linux-amd64/ossutil64 /usr/local/bin/ossutil
          ossutil --version

      - name: Configure ossutil
        run: |
          ossutil config -e ${{ secrets.OSS_ENDPOINT }} \
            -i ${{ secrets.OSS_ACCESS_KEY_ID }} \
            -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} \
            -L CH

      - name: Process and upload Windows artifacts
        if: hashFiles('QwenPaw-Desktop-Windows-*/*.exe') != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          WIN_EXE=$(find QwenPaw-Desktop-Windows-* -name "QwenPaw-Setup-*.exe" | head -1)

          if [ -z "$WIN_EXE" ]; then
            echo "No Windows exe found, skipping"
            exit 0
          fi

          echo "Processing Windows artifact: $WIN_EXE"

          # Generate metadata
          python scripts/pack/generate_oss_metadata.py \
            --file "$WIN_EXE" \
            --product desktop \
            --platform win \
            --version "$VERSION" \
            --output win-metadata.json

          # Upload file (versioned)
          ossutil cp "$WIN_EXE" \
            "oss://${OSS_BUCKET}/files/apps/desktop/win/QwenPaw-Setup-${VERSION}.exe" \
            --acl public-read \
            --force

          # Upload file (latest)
          ossutil cp "$WIN_EXE" \
            "oss://${OSS_BUCKET}/files/apps/desktop/win/QwenPaw-Setup-latest.exe" \
            --acl public-read \
            --force

          # Upload metadata (versioned)
          ossutil cp win-metadata.json \
            "oss://${OSS_BUCKET}/metadata/apps/desktop/win/QwenPaw-Setup-${VERSION}.exe.json" \
            --acl public-read \
            --force

          # Upload metadata (latest)
          ossutil cp win-metadata.json \
            "oss://${OSS_BUCKET}/metadata/apps/desktop/win/QwenPaw-Setup-latest.exe.json" \
            --acl public-read \
            --force

          echo "✓ Windows artifacts uploaded"

      - name: Process and upload macOS artifacts
        if: hashFiles('QwenPaw-Desktop-macOS-*/*.zip') != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAC_ZIP=$(find QwenPaw-Desktop-macOS-* -name "QwenPaw-*.zip" | head -1)

          if [ -z "$MAC_ZIP" ]; then
            echo "No macOS zip found, skipping"
            exit 0
          fi

          echo "Processing macOS artifact: $MAC_ZIP"

          # Generate metadata
          python scripts/pack/generate_oss_metadata.py \
            --file "$MAC_ZIP" \
            --product desktop \
            --platform mac \
            --version "$VERSION" \
            --output mac-metadata.json

          # Upload file (versioned)
          ossutil cp "$MAC_ZIP" \
            "oss://${OSS_BUCKET}/files/apps/desktop/mac/QwenPaw-${VERSION}-macOS.zip" \
            --acl public-read \
            --force

          # Upload file (latest)
          ossutil cp "$MAC_ZIP" \
            "oss://${OSS_BUCKET}/files/apps/desktop/mac/QwenPaw-latest-macOS.zip" \
            --acl public-read \
            --force

          # Upload metadata (versioned)
          ossutil cp mac-metadata.json \
            "oss://${OSS_BUCKET}/metadata/apps/desktop/mac/QwenPaw-${VERSION}-macOS.zip.json" \
            --acl public-read \
            --force

          # Upload metadata (latest)
          ossutil cp mac-metadata.json \
            "oss://${OSS_BUCKET}/metadata/apps/desktop/mac/QwenPaw-latest-macOS.zip.json" \
            --acl public-read \
            --force

          echo "✓ macOS artifacts uploaded"

      - name: Process and upload Tauri artifacts
        if: hashFiles('QwenPaw-Desktop-Tauri-*/*') != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          upload_tauri_artifact() {
            local dirs="$1"
            local pattern="$2"
            local platform="$3"
            local versioned_name="$4"
            local latest_name="$5"
            local metadata="$6"

            local artifact
            artifact=$(find ${dirs} -name "${pattern}" 2>/dev/null | head -1 || true)
            if [ -z "${artifact}" ]; then
              echo "No ${platform} Tauri artifact found, skipping"
              return 0
            fi

            echo "Processing ${platform} Tauri artifact: ${artifact}"
            python scripts/pack/generate_oss_metadata.py \
              --file "${artifact}" \
              --product desktop \
              --platform "${platform}" \
              --version "${VERSION}" \
              --output "${metadata}"

            ossutil cp "${artifact}" \
              "oss://${OSS_BUCKET}/files/apps/desktop/${platform}/${versioned_name}" \
              --acl public-read \
              --force
            ossutil cp "${artifact}" \
              "oss://${OSS_BUCKET}/files/apps/desktop/${platform}/${latest_name}" \
              --acl public-read \
              --force
            ossutil cp "${metadata}" \
              "oss://${OSS_BUCKET}/metadata/apps/desktop/${platform}/${versioned_name}.json" \
              --acl public-read \
              --force
            ossutil cp "${metadata}" \
              "oss://${OSS_BUCKET}/metadata/apps/desktop/${platform}/${latest_name}.json" \
              --acl public-read \
              --force
          }

          for variant in $VARIANTS; do
            label="${variant^}"
            upload_tauri_artifact \
              "QwenPaw-Desktop-Tauri-Windows-*-${variant}" \
              "QwenPaw-Tauri-*-Windows-${label}-setup.exe" \
              "win-tauri-${variant}" \
              "QwenPaw-Tauri-${VERSION}-Windows-${label}-setup.exe" \
              "QwenPaw-Tauri-latest-Windows-${label}-setup.exe" \
              "win-tauri-${variant}-metadata.json"
            upload_tauri_artifact \
              "QwenPaw-Desktop-Tauri-macOS-*-${variant}" \
              "QwenPaw-Tauri-*-macOS-${label}.zip" \
              "mac-tauri-${variant}" \
              "QwenPaw-Tauri-${VERSION}-macOS-${label}.zip" \
              "QwenPaw-Tauri-latest-macOS-${label}.zip" \
              "mac-tauri-${variant}-metadata.json"
          done

      - name: Upload Tauri macOS updater archives to OSS
        # The .zip is for first-install; the auto-updater pulls .app.tar.gz.
        if: hashFiles('tauri-updater-meta-macos-*/*.app.tar.gz') != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for variant in $VARIANTS; do
            label="${variant^}"
            APP_TAR_GZ=$(find tauri-updater-meta-macos-${variant} -name "QwenPaw-Tauri-*-macOS-${label}.app.tar.gz" 2>/dev/null | head -1)
            if [ -z "$APP_TAR_GZ" ]; then
              echo "No macOS ${variant} .app.tar.gz found, skipping"
              continue
            fi
            ossutil cp "$APP_TAR_GZ" \
              "oss://${OSS_BUCKET}/files/apps/desktop/mac-tauri-${variant}/QwenPaw-Tauri-${VERSION}-macOS-${label}.app.tar.gz" \
              --acl public-read \
              --force
          done

      - name: Generate and upload per-variant OSS updater manifests
        # Mirror the GitHub-pointing manifests with OSS-pointing ones so
        # mainland users hit a CN-fast endpoint first and fall back to GitHub.
        # Each variant self-updates within its own channel.
        if: hashFiles('tauri-updater-meta-*/tauri-*-updater.json') != ''
        env:
          # Pass release.body via env so quotes/newlines/$ in markdown are safe.
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OSS_BASE="${OSS_PUBLIC_BASE_URL%/}"
          NOTES="${RELEASE_BODY:-QwenPaw Desktop ${VERSION}}"
          for variant in $VARIANTS; do
            label="${variant^}"
            stage="oss-manifest-stage-${variant}"
            rm -rf "$stage"; mkdir -p "$stage"
            # Co-locate each platform sidecar with its artifact + .sig so the
            # manifest generator can resolve them from a single directory.
            cp tauri-updater-meta-windows-${variant}/* "$stage"/ 2>/dev/null || true
            find QwenPaw-Desktop-Tauri-Windows-*-${variant} -name "QwenPaw-Tauri-*-Windows-${label}-setup.exe" -exec cp {} "$stage"/ \; 2>/dev/null || true
            cp tauri-updater-meta-macos-${variant}/* "$stage"/ 2>/dev/null || true
            metadata_args=()
            for f in "$stage"/tauri-windows-*-updater.json "$stage"/tauri-darwin-*-updater.json; do
              [ -f "$f" ] && metadata_args+=(--metadata "$f")
            done
            if [ ${#metadata_args[@]} -eq 0 ]; then
              echo "No ${variant} updater sidecars found, skipping OSS manifest"
              continue
            fi
            python scripts/pack-tauri/generate_update_manifest.py manifest \
              --version "$VERSION" \
              --base-url "$OSS_BASE" \
              --target-base "windows-x86_64=${OSS_BASE}/win-tauri-${variant}" \
              --target-base "darwin-aarch64=${OSS_BASE}/mac-tauri-${variant}" \
              "${metadata_args[@]}" \
              --notes "$NOTES" \
              --output "qwenpaw-tauri-latest-oss-${variant}.json"
            ossutil cp "qwenpaw-tauri-latest-oss-${variant}.json" \
              "oss://${OSS_BUCKET}/metadata/qwenpaw-tauri-latest-${variant}.json" \
              --acl public-read \
              --force
          done
          # Mirror the default variant under the legacy unsuffixed name so
          # existing installs keep updating via qwenpaw-tauri-latest.json.
          if [ -f "qwenpaw-tauri-latest-oss-${DEFAULT_DESKTOP_VARIANT}.json" ]; then
            ossutil cp "qwenpaw-tauri-latest-oss-${DEFAULT_DESKTOP_VARIANT}.json" \
              "oss://${OSS_BUCKET}/metadata/qwenpaw-tauri-latest.json" \
              --acl public-read \
              --force
          fi

      - name: Update desktop index
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Download existing desktop/index.json if exists
          ossutil cp "oss://${OSS_BUCKET}/metadata/apps/desktop/index.json" \
            desktop-index.json 2>/dev/null || cat > desktop-index.json << 'EOF'
          {
            "product": "desktop",
            "updated_at": "",
            "platforms": {},
            "files": {}
          }
          EOF

          # Merge Windows metadata if exists
          if [ -f "win-metadata.json" ]; then
            python scripts/pack/generate_oss_metadata.py \
              --file "$(find QwenPaw-Desktop-Windows-* -name 'QwenPaw-Setup-*.exe' | head -1)" \
              --product desktop \
              --platform win \
              --version "$VERSION" \
              --output win-metadata.json \
              --merge-index desktop-index.json \
              --output-index desktop-index.json
          fi

          # Merge macOS metadata if exists
          if [ -f "mac-metadata.json" ]; then
            python scripts/pack/generate_oss_metadata.py \
              --file "$(find QwenPaw-Desktop-macOS-* -name 'QwenPaw-*.zip' | head -1)" \
              --product desktop \
              --platform mac \
              --version "$VERSION" \
              --output mac-metadata.json \
              --merge-index desktop-index.json \
              --output-index desktop-index.json
          fi

          merge_tauri_metadata() {
            local metadata="$1"
            local dirs="$2"
            local pattern="$3"
            local platform="$4"
            if [ ! -f "${metadata}" ]; then
              return 0
            fi
            python scripts/pack/generate_oss_metadata.py \
              --file "$(find ${dirs} -name "${pattern}" | head -1)" \
              --product desktop \
              --platform "${platform}" \
              --version "$VERSION" \
              --output "${metadata}" \
              --merge-index desktop-index.json \
              --output-index desktop-index.json
          }

          for variant in $VARIANTS; do
            label="${variant^}"
            merge_tauri_metadata \
              "win-tauri-${variant}-metadata.json" \
              "QwenPaw-Desktop-Tauri-Windows-*-${variant}" \
              "QwenPaw-Tauri-*-Windows-${label}-setup.exe" \
              "win-tauri-${variant}"
            merge_tauri_metadata \
              "mac-tauri-${variant}-metadata.json" \
              "QwenPaw-Desktop-Tauri-macOS-*-${variant}" \
              "QwenPaw-Tauri-*-macOS-${label}.zip" \
              "mac-tauri-${variant}"
          done

          # Upload updated desktop/index.json
          ossutil cp desktop-index.json \
            "oss://${OSS_BUCKET}/metadata/apps/desktop/index.json" \
            --acl public-read \
            --force

          echo "✓ Desktop index updated"

      - name: Update main index
        run: |
          # Download main index if exists
          ossutil cp "oss://${OSS_BUCKET}/metadata/index.json" \
            main-index.json 2>/dev/null || cat > main-index.json << 'EOF'
          {
            "version": "1.0",
            "updated_at": "",
            "products": {}
          }
          EOF

          # Ensure desktop product is in main index
          python3 << 'PYTHON'
          import json
          from datetime import datetime, timezone

          with open("main-index.json", "r") as f:
              index = json.load(f)

          index["updated_at"] = datetime.now(timezone.utc).isoformat()

          if "desktop" not in index["products"]:
              index["products"]["desktop"] = {
                  "name": {
                      "zh-CN": "桌面客户端",
                      "en-US": "Desktop Client"
                  },
                  "index_url": "/metadata/apps/desktop/index.json"
              }

          with open("main-index.json", "w") as f:
              json.dump(index, f, indent=2, ensure_ascii=False)
          PYTHON

          # Upload main index
          ossutil cp main-index.json \
            "oss://${OSS_BUCKET}/metadata/index.json" \
            --acl public-read \
            --force

          echo "✓ Main index updated"
