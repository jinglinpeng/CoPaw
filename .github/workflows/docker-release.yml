# Build QwenPaw multi-arch Docker image and push to DockerHub + Aliyun ACR on release.
# Pre-release: update <version> and pre only.
# Formal release: update <version>, pre and latest.
#
# Manual builds export the verified amd64 image unless pushing is enabled.
# Release pipeline: verify (amd64 + health-check) → build-and-push (multi-arch).
name: Docker Build and Push on Release

on:
  # NOTE: legacy fallback path. The standard release flow is now release.yml
  # (see RELEASING.md). Publishing a GitHub Release directly still triggers this
  # OLD publish, which is NOT gated on the desktop build. Kept only as an
  # emergency rollback until the old release workflows are removed.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag when pushing (e.g. v1.2.3 or v1.2.3-beta.1)"
        required: true
        type: string
      push_image:
        description: "Push to DockerHub + ACR (false = download verified amd64 image only)"
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: "Pre-release (do not update latest tag)"
        required: false
        type: boolean
        default: false
      full_artifacts:
        description: "Build and verify both ACR architectures, download artifacts only"
        required: false
        type: boolean
        default: false

env:
  ACR_REGISTRY: agentscope-registry.ap-southeast-1.cr.aliyuncs.com
  IMAGE: agentscope/qwenpaw

jobs:
  # ── Stage 1: Verify Docker image boots correctly ───────────────────────────
  verify-docker:
    if: ${{ !inputs.full_artifacts }}
    uses: ./.github/workflows/release-verify.yml
    with:
      verify_docker: true
      export_docker_image: ${{ github.event_name == 'workflow_dispatch' && !inputs.push_image }}
      docker_node_image: ${{ github.event_name == 'workflow_dispatch' && !inputs.push_image && 'node:20-bookworm-slim' || '' }}
      docker_uv_image: ${{ github.event_name == 'workflow_dispatch' && !inputs.push_image && 'ghcr.io/astral-sh/uv:latest' || '' }}
    secrets: inherit

  # ── Stage 2: Build multi-arch and push ─────────────────────────────────────
  build-and-push:
    if: ${{ !inputs.full_artifacts && (github.event_name == 'release' || inputs.push_image) }}
    needs: [verify-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get QwenPaw version
        id: qwenpaw_version
        uses: ./.github/actions/get-version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Set version and prerelease flag
        id: vars
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT

            # Parse version to determine if it's a pre-release
            # Beta/alpha/rc/dev are pre-releases, but .post is NOT
            if [[ "$VERSION" =~ (beta|alpha|rc|dev) ]]; then
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
            elif [[ "$VERSION" =~ post ]]; then
              # .post versions should update latest (post-release patches)
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
            else
              # Use GitHub's prerelease flag as fallback
              echo "is_prerelease=${{ github.event.release.prerelease }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "is_prerelease=${{ github.event.inputs.is_prerelease }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push multi-arch (version + pre [+ latest])
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          IS_PRERELEASE: ${{ steps.vars.outputs.is_prerelease }}
          QWENPAW_DISABLED_CHANNELS: "imessage"
          QWENPAW_VERSION: ${{ steps.qwenpaw_version.outputs.version }}
        run: |
          TAGS="-t ${ACR_REGISTRY}/${IMAGE}:${VERSION} -t ${ACR_REGISTRY}/${IMAGE}:pre"
          TAGS="${TAGS} -t docker.io/${IMAGE}:${VERSION} -t docker.io/${IMAGE}:pre"
          if [ "${IS_PRERELEASE}" != "true" ]; then
            TAGS="${TAGS} -t ${ACR_REGISTRY}/${IMAGE}:latest -t docker.io/${IMAGE}:latest"
          fi
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f deploy/Dockerfile \
            --build-arg QWENPAW_DISABLED_CHANNELS="${QWENPAW_DISABLED_CHANNELS}" \
            --build-arg \
            QWENPAW_MANAGED_RUNTIME_BOUNDARY_VERSION="${QWENPAW_VERSION}" \
            ${TAGS} --push .

  build-artifacts:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_artifacts }}
    name: Build and verify ACR (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      ARCH: ${{ matrix.arch }}
      ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Get QwenPaw version
        id: version
        uses: ./.github/actions/get-version
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ACR when credentials are available
        if: env.ACR_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - name: Build with production ACR defaults
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/docker-artifacts"
          docker buildx build --platform "linux/$ARCH" \
            -f deploy/Dockerfile \
            --build-arg QWENPAW_DISABLED_CHANNELS=imessage \
            --build-arg QWENPAW_MANAGED_RUNTIME_BOUNDARY_VERSION="$VERSION" \
            --output "type=oci,dest=$RUNNER_TEMP/qwenpaw-$ARCH.oci.tar" \
            --metadata-file "$RUNNER_TEMP/docker-artifacts/build-metadata.json" .
      - name: Load and verify the exported image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo copy --override-os linux --override-arch "$ARCH" \
            "oci-archive:$RUNNER_TEMP/qwenpaw-$ARCH.oci.tar" \
            "docker-daemon:qwenpaw-verify:$ARCH"
          bash .github/scripts/verify-docker-artifacts.sh
      - name: Export verified Docker image
        run: |
          docker save "qwenpaw-verify:$ARCH" | gzip > \
            "$RUNNER_TEMP/docker-artifacts/qwenpaw-$ARCH.tar.gz"
          cd "$RUNNER_TEMP/docker-artifacts"
          sha256sum "qwenpaw-$ARCH.tar.gz" > SHA256SUMS
      - name: Upload verified Docker image
        uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-image-${{ matrix.arch }}-acr
          path: ${{ runner.temp }}/docker-artifacts/
          compression-level: 0
          retention-days: 7
      - name: Upload OCI input for multi-arch assembly
        uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-oci-${{ matrix.arch }}
          path: ${{ runner.temp }}/qwenpaw-${{ matrix.arch }}.oci.tar
          compression-level: 0
          retention-days: 1
      - name: Collect logs
        if: always()
        run: |
          docker logs qwenpaw-artifact-test > "$RUNNER_TEMP/container.log" 2>&1 || true
          docker exec qwenpaw-artifact-test tail -n 100 /var/log/app.err.log \
            > "$RUNNER_TEMP/app-error.log" 2>&1 || true
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-verification-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/container.log
            ${{ runner.temp }}/app-error.log
            ${{ runner.temp }}/docker-artifacts/*.json
            ${{ runner.temp }}/docker-artifacts/*.log
            ${{ runner.temp }}/docker-artifacts/*.png
          retention-days: 7

  assemble-artifact:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_artifacts }}
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: qwenpaw-oci-*
          path: ${{ runner.temp }}/oci-inputs
      - name: Assemble verified multi-arch OCI archive
        run: |
          mkdir -p "$RUNNER_TEMP/amd64" "$RUNNER_TEMP/arm64" \
            "$RUNNER_TEMP/merged/blobs" "$RUNNER_TEMP/multiarch-artifact"
          for arch in amd64 arm64; do
            tar -xf "$RUNNER_TEMP/oci-inputs/qwenpaw-oci-$arch/qwenpaw-$arch.oci.tar" \
              -C "$RUNNER_TEMP/$arch"
            cp -an "$RUNNER_TEMP/$arch/blobs/." "$RUNNER_TEMP/merged/blobs/"
          done
          cp "$RUNNER_TEMP/amd64/oci-layout" "$RUNNER_TEMP/merged/oci-layout"
          python3 .github/scripts/merge-docker-oci.py "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/merged/index.json" "$RUNNER_TEMP/multiarch-artifact/index.json"
          tar -C "$RUNNER_TEMP/merged" -cf "$RUNNER_TEMP/multiarch-artifact/qwenpaw-image.oci.tar" \
            oci-layout index.json blobs
          cd "$RUNNER_TEMP/multiarch-artifact"
          sha256sum qwenpaw-image.oci.tar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-image-multiarch-acr
          path: ${{ runner.temp }}/multiarch-artifact/
          compression-level: 0
          retention-days: 7
