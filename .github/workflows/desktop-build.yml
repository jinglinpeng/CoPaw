name: Verify existing Linux deb with real chat

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Verification source ref
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  verify-linux-deb-chat:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Download the previously built installer
        uses: actions/download-artifact@v4
        with:
          name: tauri-linux
          path: downloaded
          repository: ${{ github.repository }}
          run-id: 44002211870
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installer checksum and metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          packages = list(Path('downloaded').rglob('QwenPaw-Tauri-*-linux-x86_64.deb'))
          assert len(packages) == 1, packages
          package = packages[0]
          checksum = package.with_name(package.name + '.sha256')
          assert checksum.is_file(), checksum
          Path('dist').mkdir()
          shutil.move(str(package), 'dist/' + package.name)
          shutil.move(str(checksum), 'dist/' + checksum.name)
          PY
          sha256sum -c dist/*.deb.sha256
          cat dist/*.deb.sha256
          dpkg-deb -f dist/*.deb Package Version Architecture Depends

      - name: Install the downloaded deb before verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$PWD"/dist/*.deb
          dpkg-query -W -f='${Package} ${Version} ${Status}\n' qwen-paw-desktop
          ldd /usr/bin/qwenpaw-desktop > "${RUNNER_TEMP}/native-library-check.log"
          cat "${RUNNER_TEMP}/native-library-check.log"
          if grep -q 'not found' "${RUNNER_TEMP}/native-library-check.log"; then
            echo '::error::Installed executable has unresolved shared libraries'
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install virtual display
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Require the configured chat verification key
        env:
          QWENPAW_DASHSCOPE_API_KEY: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}
        run: |
          if [ -z "$QWENPAW_DASHSCOPE_API_KEY" ]; then
            echo "::error::QWENPAW_DASHSCOPE_API_KEY is required for chat verification"
            exit 1
          fi

      - name: Verify installed desktop and real model response
        timeout-minutes: 15
        uses: ./.github/actions/verify-tauri-linux
        with:
          dashscope-api-key: ${{ secrets.QWENPAW_DASHSCOPE_API_KEY }}
          allow-flaky-llm: "false"

      - name: Stop desktop processes
        if: always()
        run: |
          pkill -f qwenpaw-desktop 2>/dev/null || true
          pkill -f qwenpaw-backend 2>/dev/null || true
          sleep 2
          pkill -9 -f qwenpaw-desktop 2>/dev/null || true
          pkill -9 -f qwenpaw-backend 2>/dev/null || true

      - name: Preserve installation and chat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8444-installed-deb-chat-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            dist/*.sha256
            ${{ runner.temp }}/native-library-check.log
            ${{ runner.temp }}/qwenpaw-desktop-stdout.log
            ${{ runner.temp }}/qwenpaw-desktop-stderr.log
            ${{ runner.temp }}/verify-screenshots/
