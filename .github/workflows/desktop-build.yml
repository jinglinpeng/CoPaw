name: Verify signed Linux updates

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Build run containing the signed pair
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  verify-linux-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ubuntu-desktop-upgrade-pair
          path: update-pair

      - name: Check package integrity and version ordering
        run: |
          cd update-pair
          sha256sum -c package-checksums.txt
          sha256sum -c ./*.deb.sig.sha256
          sha256sum -c tauri-linux-x86_64-deb-updater.json.sha256
          prior=$(dpkg-deb -f QwenPaw-Tauri-2.3.1b1-linux-x86_64.deb Version)
          candidate=$(dpkg-deb -f QwenPaw-Tauri-2.3.1-linux-x86_64.deb Version)
          test "$prior" = '2.3.1~beta.1'
          test "$candidate" = '2.3.1'
          dpkg --compare-versions "$prior" lt "$candidate"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare local browser and the private test update server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth webkit2gtk-driver pkexec
          python -m pip install packaging
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$RUNNER_TEMP/update-server.key" -out "$RUNNER_TEMP/update-server.crt"
          sudo install -m 644 "$RUNNER_TEMP/update-server.crt" /usr/local/share/ca-certificates/qwenpaw-test.crt
          sudo update-ca-certificates
          python scripts/pack-tauri/generate_update_manifest.py manifest \
            --version 2.3.1 --base-url https://localhost:8443 \
            --metadata update-pair/tauri-linux-x86_64-deb-updater.json \
            --notes "Isolated Linux update smoke test" --output update-pair/latest.json

      - name: Authorize dpkg on the disposable runner
        run: |
          # On a hosted runner Xvfb has no interactive PolicyKit agent.
          sudo tee /etc/polkit-1/rules.d/49-qwenpaw-update-smoke.rules >/dev/null <<'POLICY'
          polkit.addRule(function(action, subject) {
            if (action.id == "org.freedesktop.policykit.exec" &&
                action.lookup("program") == "/usr/bin/dpkg" &&
                subject.user == "runner") {
              return polkit.Result.YES;
            }
          });
          POLICY
          sudo systemctl start polkit
          pkexec /usr/bin/dpkg --version

      - name: Exercise immediate and cached app updates
        timeout-minutes: 20
        run: |
          export UPDATER_TEST_CERT="$RUNNER_TEMP/update-server.crt"
          export UPDATER_TEST_TLS_KEY="$RUNNER_TEMP/update-server.key"
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            python scripts/verify/verify_linux_update_pair.py update-pair

      - name: Collect package maintenance and desktop logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/linux-upgrade-evidence"
          sudo cp /var/log/dpkg.log "$RUNNER_TEMP/linux-upgrade-evidence/dpkg.log"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/linux-upgrade-evidence/dpkg.log"
          sudo journalctl -t pkexec --no-pager > "$RUNNER_TEMP/linux-upgrade-evidence/pkexec.log"
          sudo rm -f /etc/polkit-1/rules.d/49-qwenpaw-update-smoke.rules

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-update-verification
          path: |
            ${{ runner.temp }}/linux-upgrade-evidence/*.log
            ${{ runner.temp }}/linux-upgrade-evidence/*.png
