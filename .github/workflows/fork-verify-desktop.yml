name: PR 8444 native deb diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native runtime and driver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb webkit2gtk-driver libtbb12

      - name: Download deb from the failed AppImage build
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43833266614
          name: pr8444-linux-packaging-evidence
          path: prior-build

      - name: Install prior deb for native-window diagnostics
        run: |
          deb="$(find "$PWD/prior-build" -name '*.deb' -print -quit)"
          test -n "$deb"
          sudo apt-get install -y "$deb"
          mkdir -p dist
          # The verifier resolves this symlink to the installed native binary.
          # This diagnoses the deb; it does not validate an AppImage.
          ln -s /usr/bin/qwenpaw-desktop dist/QwenPaw-Tauri-prior-deb-linux-x86_64.AppImage

      - name: Verify the installed deb's native window and backend
        uses: ./.github/actions/verify-tauri-linux

      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8444-native-deb-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qwenpaw-desktop-stdout.log
            ${{ runner.temp }}/qwenpaw-desktop-stderr.log
            ${{ runner.temp }}/verify-screenshots/
            ~/.qwenpaw/**/launcher.log
            ~/.qwenpaw/desktop.log
